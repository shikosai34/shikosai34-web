  - name: events
    label: ステージ企画
    label_singular: ステージ企画
    description: '開催ごとの企画を登録します。通常版は一般向けのみ、完全版（/timetable/committee-events）は実行委員向けを含みます。'
    folder: content/events
    create: true
    slug: '{{fields.slug}}'
    identifier_field: title
    summary: '{{fields.startAt}}｜{{fields.eventName}}｜{{fields.title}}'
    sortable_fields: [startAt, endAt, eventName, title, performer, venue]
    view_filters:
      - { label: 前夜祭（10月23日）, field: startAt, pattern: '^2026-10-23' }
      - { label: 1日目（10月24日）, field: startAt, pattern: '^2026-10-24' }
      - { label: 2日目（10月25日）, field: startAt, pattern: '^2026-10-25' }
      - { label: 時間変更あり, field: status, pattern: 'changed' }
      - { label: 中止, field: status, pattern: 'cancelled' }
    fields:
      - label: イベント名
        name: eventName
        widget: string
        hint: 'タイムテーブル上のグループ名です。同じ開催日の同じ会場にある企画は、この名前ごとにまとめて表示します（例: 軽音ライブ、前夜祭）。'
      - { label: 企画名, name: title, widget: string }
      - label: URL 識別子
        name: slug
        widget: string
        hint: 'URL の末尾に使う半角英数字とハイフン（例: brass-band）。公開後は変更しないでください。'
        pattern:
          ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '半角の英小文字・数字・ハイフンのみで入力してください']
      - label: 出演団体
        name: performer
        widget: string
        hint: '公開する団体名を入力してください。個人名や連絡先は入力しないでください。'
      - label: 開始日時
        name: startAt
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
        format: 'YYYY-MM-DD[T]HH:mm:ss[+09:00]'
        picker_utc: false
        hint: '開催日の2026年10月23日〜25日を選んでください。'
      - label: 終了日時
        name: endAt
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
        format: 'YYYY-MM-DD[T]HH:mm:ss[+09:00]'
        picker_utc: false
        hint: '開始日時と同じ日で、開始より後の時刻を選んでください。10月23日〜25日のいずれかを選んでください。'
      - label: ジャンル
        name: genre
        widget: select
        default: other
        options:
          - { label: 音楽, value: music }
          - { label: ダンス, value: dance }
          - { label: パフォーマンス, value: performance }
          - { label: 大会・コンテスト, value: contest }
          - { label: 式典, value: ceremony }
          - { label: その他, value: other }
      - label: 会場
        name: venue
        widget: select
        default: main-stage
        options:
          - { label: 中ステージ（第一体育館）, value: main-stage }
          - { label: 大教室, value: large-classroom }
          - { label: 視聴覚室, value: audiovisual-room }
          - { label: 予選会場, value: preliminary-venue }
          - { label: ロータリー, value: rotary }
          - { label: 一般サークル会場, value: general-circles }
          - { label: その他, value: other }
      - label: 当日の状態
        name: status
        widget: select
        default: scheduled
        options:
          - { label: 予定どおり, value: scheduled }
          - { label: 時間変更あり, value: changed }
          - { label: 中止, value: cancelled }
        hint: '直前の変更を来場者へ目立たせたい場合に切り替えます。'
      - label: タイムテーブル上の表示
        name: displayMode
        widget: select
        default: timed
        options:
          - { label: 時刻に配置, value: timed }
          - { label: 長時間の予定として表示, value: long }
        hint: '終日営業や本祭運営など、長い時間続く予定は「長時間の予定として表示」を選ぶと、時刻軸を大きく占有しません。'
      - label: 見出し画像
        name: image
        widget: image-r2
        required: false
        hint: '未入力でも公開できます。詳細ページで大きく表示し、押すと拡大できます。画像は自動でリサイズ・WebP 変換して R2 に保存します。'
      - label: その他の写真
        name: otherImages
        widget: list
        required: false
        label_singular: 写真
        field:
          label: 写真
          name: image
          widget: image-r2
        hint: '詳細ページに並べて表示し、押すと拡大できます。複数追加できます。'
      - label: SNS・公式サイトのリンク
        name: snsLinks
        widget: list
        required: false
        label_singular: リンク
        summary: '{{fields.label}}'
        fields:
          - { label: リンク名, name: label, widget: string, hint: '例: X / Instagram / 公式サイト' }
          - label: リンク先 URL
            name: url
            widget: string
            pattern: ['^https?://', 'http:// または https:// で始まる URL を入力してください']
          - label: リンクプレビュー画像（任意）
            name: previewImage
            widget: image-r2
            required: false
            hint: 'noteのリンクカードのように画像付きで表示します。未設定なら画像なしのリンクカードになります。'
      - label: 短い説明
        name: description
        widget: text
        required: false
        hint: '詳細ページの企画名の下に表示する1〜2文の説明です。'
      - label: 実行委員限定
        name: committeeOnly
        widget: boolean
        default: false
        hint: 'オンにすると通常版には出ず、完全版（/timetable/committee-events）だけに表示します。'
      - label: セットリスト
        name: setlist
        widget: list
        required: false
        field: { label: 曲名・項目, name: item, widget: string }
        hint: '曲順がある場合に任意で追加します。未入力なら詳細ページに表示されません。'
      - label: 下書き
        name: draft
        widget: boolean
        default: false
        hint: 'オンにしている間は本番サイトに表示されません。'
      - label: 詳細
        name: body
        widget: markdown
        required: false

  - name: sponsors
    label: 協賛企業
    label_singular: 協賛企業
    description: '協賛企業を管理します。/sponsor に五十音順で表示され、協賛金額に応じて企業名の文字サイズが変わります。'
