# Decap CMS 設定 — お知らせ、サークル、ステージ企画
#
# アクセス制御と GitHub 書き込み:
#   /admin/* と /cms/*（CMS Backend Worker）を Cloudflare Zero Trust Access で保護する。
#   編集者に GitHub ログインは求めない。base_url / api_root を workers/cms の Worker に
#   向け、Worker が installation token で GitHub REST API を代行する（Issue #17）。
#
# ローカルプレビュー:
#   `npx decap-server` を起動し、`bun dev` の http://localhost:4321/admin/ を開く。
#   （local_backend が有効な間は下の base_url / api_root は使われない）

backend:
  name: github
  repo: shikosai34/shikosai34-web
  branch: main # TODO(#17): Cloudflare のデプロイ対象ブランチに合わせて確認する
  # CMS Backend Worker（workers/cms）。34.shikosai.net/cms/* にマウント。
  base_url: https://34.shikosai.net
  api_root: https://34.shikosai.net/cms/github
  auth_endpoint: cms/auth
  commit_messages:
    create: 'cms: add {{collection}}/{{slug}}'
    update: 'cms: update {{collection}}/{{slug}}'
    delete: 'cms: delete {{collection}}/{{slug}}'
    openAuthoring: 'cms: {{message}}'

# `npx decap-server` を使ったローカル編集を許可する（本番には影響しない）
local_backend: true

locale: ja

# 見出し画像は image-r2 ウィジェット経由で R2 へアップロードする（下記フィールド定義）。
# ここの media_folder は本文（Markdown）中に挿入する画像用で、リポジトリへコミットされる。
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: news
    label: お知らせ
    label_singular: お知らせ
    description: 'ここで公開したお知らせは main へコミットされ、サイトのビルド後に /news へ反映されます。'
    folder: content/news
    create: true
    slug: '{{fields.slug}}'
    identifier_field: title
    sortable_fields: [publishedAt, title]
    fields:
      - { label: タイトル, name: title, widget: string }
      - label: URL 識別子
        name: slug
        widget: string
        hint: 'URL の末尾に使う半角英数字とハイフン（例: opening-hours）。公開後は変更しないでください。'
        pattern:
          ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '半角の英小文字・数字・ハイフンのみで入力してください']
      - label: 公開日時
        name: publishedAt
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
        format: 'YYYY-MM-DD[T]HH:mm:ss[+09:00]'
        picker_utc: false
      - label: 更新日時
        name: updatedAt
        widget: datetime
        required: false
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
        format: 'YYYY-MM-DD[T]HH:mm:ss[+09:00]'
        picker_utc: false
      - label: カテゴリ
        name: category
        widget: select
        default: news
        options:
          - { label: お知らせ, value: news }
          - { label: イベント, value: event }
          - { label: メディア掲載, value: press }
          - { label: 更新情報, value: update }
      - label: 見出し画像
        name: image
        widget: image-r2
        required: false
        hint: 'スマホの写真をそのままで大丈夫です。自動でリサイズ・WebP 変換して R2 に保存します。'
      - label: 要約
        name: description
        widget: text
        required: false
        hint: '一覧や SNS 共有時に表示される短い説明文。'
      - label: 下書き
        name: draft
        widget: boolean
        default: false
        hint: 'オンにしている間は本番サイトに表示されません。'
      - { label: 重要なお知らせ, name: important, widget: boolean, default: false }
      - { label: 本文, name: body, widget: markdown }

  - name: circles
    label: サークル
    label_singular: サークル
    description: 'ここで作成・編集したサークルは main へコミットされ、ビルド後に /circle へ反映されます。'
    folder: content/circles
    create: true
    slug: '{{fields.slug}}'
    identifier_field: name
    summary: '{{fields.slug}} - {{name}}'
    sortable_fields: [nameKana, name]
    fields:
      - { label: 団体名, name: name, widget: string }
      - label: 団体名（かな）
        name: nameKana
        widget: string
        hint: 'ひらがな。一覧の並び順に使います。'
      - label: URL 識別子
        name: slug
        widget: string
        hint: 'URL の末尾に使う半角英数字とハイフン（例: robotics）。公開後は変更しないでください。'
        pattern:
          ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '半角の英小文字・数字・ハイフンのみで入力してください']
      - label: カテゴリ
        name: category
        widget: select
        options:
          - { label: 1年生, value: grade1 }
          - { label: 2年生, value: grade2 }
          - { label: 3年生, value: grade3 }
          - { label: 4年生, value: grade4 }
          - { label: 5年生, value: grade5 }
          - { label: 専攻科, value: advanced }
          - { label: 運動部, value: sports }
          - { label: 文化部, value: culture }
          - { label: 有志団体, value: other }
      - { label: 実施場所, name: location, widget: string, hint: '教室名など。' }
      - { label: 雨天時の場所・対応, name: rainLocation, widget: string, required: false, hint: '雨天時の場所、または中止などの対応。' }
      - label: サークルカテゴリ
        name: genre
        widget: select
        options:
          - { label: 文化, value: culture }
          - { label: 食品, value: food }
          - { label: 技術, value: tech }
      - label: 紹介文（短文）
        name: summary
        widget: text
        hint: '一覧のカードと詳細ページの冒頭に表示される、1〜2文の短い紹介です。'
      - label: 見所
        name: highlights
        widget: text
        required: false
        hint: '来場者に見てほしいポイント。'
      - label: 価格・企画内容
        name: details
        widget: text
        required: false
        hint: '商品や体験の価格、企画の内容など。'
      - label: 実施時間（10月24日）
        name: scheduleDay1
        widget: string
        required: false
        hint: '開催時間（分かる場合）または「出店あり」。実施しない日は空欄にしてください。'
      - label: 実施時間（10月25日）
        name: scheduleDay2
        widget: string
        required: false
        hint: '開催時間（分かる場合）または「出店あり」。実施しない日は空欄にしてください。'
      - { label: FesFlow 導入予定, name: fesflowPlanned, widget: boolean, default: false }
      - label: サムネイル画像
        name: image
        widget: image-r2
        required: false
        hint: '画像は自動でリサイズ・WebP変換してR2へ保存されます。詳細ページで大きく表示され、押すと拡大できます。'
      - label: その他画像
        name: otherImages
        widget: list
        required: false
        label_singular: 画像
        field:
          label: 画像
          name: image
          widget: image-r2
        hint: '詳細ページに並べて表示し、押すと拡大できます。複数追加できます。'
      - label: SNS・公式サイトのリンク
        name: snsLinks
        widget: list
        required: false
        label_singular: リンク
        summary: '{{fields.label}}'
        fields:
          - { label: リンク名, name: label, widget: string, hint: '例: X / Instagram / 公式サイト' }
          - label: リンク先 URL
            name: url
            widget: string
            pattern: ['^https?://', 'http:// または https:// で始まる URL を入力してください']
          - label: リンクプレビュー画像（任意）
            name: previewImage
            widget: image-r2
            required: false
            hint: 'noteのリンクカードのように画像付きで表示します。未設定なら画像なしのリンクカードになります。'
      - label: FesFlow ページ URL
        name: fesflowUrl
        widget: string
        required: false
        pattern: ['^https?://', 'http:// または https:// で始まる URL を入力してください']
        hint: '実行委員会が後から入力します。'
      - { label: 詳細, name: body, widget: markdown }

  - name: events
    label: ステージ企画
    label_singular: ステージ企画
    description: '開催ごとの企画を登録します。通常版は一般向けのみ、完全版（/timetable/committee-events）は実行委員向けを含みます。'
    folder: content/events
    create: true
    slug: '{{fields.slug}}'
    identifier_field: title
    summary: '{{fields.startAt}}｜{{fields.eventName}}｜{{fields.title}}'
    sortable_fields: [startAt, endAt, eventName, title, performer, venue]
    view_filters:
      - { label: 前夜祭（10月23日）, field: startAt, pattern: '^2026-10-23' }
      - { label: 1日目（10月24日）, field: startAt, pattern: '^2026-10-24' }
      - { label: 2日目（10月25日）, field: startAt, pattern: '^2026-10-25' }
      - { label: 時間変更あり, field: status, pattern: 'changed' }
      - { label: 中止, field: status, pattern: 'cancelled' }
    fields:
      - label: イベント名
        name: eventName
        widget: string
        hint: 'タイムテーブル上のグループ名です。同じ開催日の同じ会場にある企画は、この名前ごとにまとめて表示します（例: 軽音ライブ、前夜祭）。'
      - { label: 企画名, name: title, widget: string }
      - label: URL 識別子
        name: slug
        widget: string
        hint: 'URL の末尾に使う半角英数字とハイフン（例: brass-band）。公開後は変更しないでください。'
        pattern:
          ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '半角の英小文字・数字・ハイフンのみで入力してください']
      - label: 出演団体
        name: performer
        widget: string
        hint: '公開する団体名を入力してください。個人名や連絡先は入力しないでください。'
      - label: 開始日時
        name: startAt
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
        format: 'YYYY-MM-DD[T]HH:mm:ss[+09:00]'
        picker_utc: false
        hint: '開催日の2026年10月23日〜25日を選んでください。'
      - label: 終了日時
        name: endAt
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
        format: 'YYYY-MM-DD[T]HH:mm:ss[+09:00]'
        picker_utc: false
        hint: '開始日時と同じ日で、開始より後の時刻を選んでください。10月23日〜25日のいずれかを選んでください。'
      - label: ジャンル
        name: genre
        widget: select
        default: other
        options:
          - { label: 音楽, value: music }
          - { label: ダンス, value: dance }
          - { label: パフォーマンス, value: performance }
          - { label: 大会・コンテスト, value: contest }
          - { label: 式典, value: ceremony }
          - { label: その他, value: other }
      - label: 会場
        name: venue
        widget: select
        default: main-stage
        options:
          - { label: 中ステージ（第一体育館）, value: main-stage }
          - { label: 大教室, value: large-classroom }
          - { label: 視聴覚室, value: audiovisual-room }
          - { label: 予選会場, value: preliminary-venue }
          - { label: ロータリー, value: rotary }
          - { label: 一般サークル会場, value: general-circles }
          - { label: その他, value: other }
      - label: 当日の状態
        name: status
        widget: select
        default: scheduled
        options:
          - { label: 予定どおり, value: scheduled }
          - { label: 時間変更あり, value: changed }
          - { label: 中止, value: cancelled }
        hint: '直前の変更を来場者へ目立たせたい場合に切り替えます。'
      - label: タイムテーブル上の表示
        name: displayMode
        widget: select
        default: timed
        options:
          - { label: 時刻に配置, value: timed }
          - { label: 長時間の予定として表示, value: long }
        hint: '終日営業や本祭運営など、長い時間続く予定は「長時間の予定として表示」を選ぶと、時刻軸を大きく占有しません。'
      - label: 見出し画像
        name: image
        widget: image-r2
        required: false
        hint: '未入力でも公開できます。詳細ページで大きく表示し、押すと拡大できます。画像は自動でリサイズ・WebP 変換して R2 に保存します。'
      - label: その他の写真
        name: otherImages
        widget: list
        required: false
        label_singular: 写真
        field:
          label: 写真
          name: image
          widget: image-r2
        hint: '詳細ページに並べて表示し、押すと拡大できます。複数追加できます。'
      - label: SNS・公式サイトのリンク
        name: snsLinks
        widget: list
        required: false
        label_singular: リンク
        summary: '{{fields.label}}'
        fields:
          - { label: リンク名, name: label, widget: string, hint: '例: X / Instagram / 公式サイト' }
          - label: リンク先 URL
            name: url
            widget: string
            pattern: ['^https?://', 'http:// または https:// で始まる URL を入力してください']
          - label: リンクプレビュー画像（任意）
            name: previewImage
            widget: image-r2
            required: false
            hint: 'noteのリンクカードのように画像付きで表示します。未設定なら画像なしのリンクカードになります。'
      - label: 短い説明
        name: description
        widget: text
        required: false
        hint: '詳細ページの企画名の下に表示する1〜2文の説明です。'
      - label: 実行委員限定
        name: committeeOnly
        widget: boolean
        default: false
        hint: 'オンにすると通常版には出ず、完全版（/timetable/committee-events）だけに表示します。'
      - label: セットリスト
        name: setlist
        widget: list
        required: false
        field: { label: 曲名・項目, name: item, widget: string }
        hint: '曲順がある場合に任意で追加します。未入力なら詳細ページに表示されません。'
      - label: 下書き
        name: draft
        widget: boolean
        default: false
        hint: 'オンにしている間は本番サイトに表示されません。'
      - label: 詳細
        name: body
        widget: markdown
        required: false

  - name: sponsors
    label: 協賛企業
    label_singular: 協賛企業
    description: '協賛企業を管理します。/sponsor に五十音順で表示され、協賛金額に応じて企業名の文字サイズが変わります。'
    folder: content/sponsors
    create: true
    slug: '{{fields.name}}'
    identifier_field: name
    summary: '{{fields.nameKana}}｜{{fields.name}}'
    sortable_fields: [nameKana, name, amount]
    fields:
      - { label: 企業名, name: name, widget: string }
      - label: 読み仮名
        name: nameKana
        widget: string
        hint: '五十音順の並び替えに使います。ひらがなで入力してください（例: みりおんすぽーつ）。'
      - label: 協賛金額（円）
        name: amount
        widget: number
        value_type: int
        min: 1
        hint: 'この値は画面には表示されません。文字サイズの算出にのみ使用します。'
      - label: 企業サイト URL
        name: url
        widget: string
        required: false
        pattern: ['^https?://', 'http:// または https:// から始まる URL を入力してください']
        hint: '未入力でも公開できます。入力すると企業名からリンクします。'
      - label: 下書き
        name: draft
        widget: boolean
        default: false
        hint: 'オンにしている間は本番サイトに表示されません。'

  - name: goods
    label: グッズ
    label_singular: グッズ
    description: 'グッズを管理します。/goods に表示順で並び、カードを開くと本文が詳細説明として表示されます。'
    folder: content/goods
    create: true
    slug: '{{fields.slug}}'
    identifier_field: name
    summary: '{{fields.name}}｜{{fields.price}}円'
    sortable_fields: [order, name, price]
    fields:
      - { label: グッズ名, name: name, widget: string }
      - label: URL 識別子
        name: slug
        widget: string
        hint: 'ファイル名に使う半角英数字とハイフン（例: tote-bag）。公開後は変更しないでください。'
        pattern:
          ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '半角の英小文字・数字・ハイフンのみで入力してください']
      - label: 価格（円）
        name: price
        widget: number
        value_type: int
        min: 0
      - label: 画像
        name: image
        widget: image-r2
        required: false
        hint: 'スマホの写真をそのままで大丈夫です。自動でリサイズ・WebP 変換して R2 に保存します。'
      - label: 売り切れ
        name: soldOut
        widget: boolean
        default: false
        hint: 'オンにすると一覧に「売り切れ」と表示されます。'
      - label: 表示順
        name: order
        widget: number
        value_type: int
        default: 100
        hint: '小さい数字ほど先頭に表示されます。'
      - label: 下書き
        name: draft
        widget: boolean
        default: false
        hint: 'オンにしている間は本番サイトに表示されません。'
      - label: 詳細説明
        name: body
        widget: markdown
        hint: 'カードを開いたときのポップアップに表示されます。'

  - name: goods-sponsors
    label: 物品協賛
    label_singular: 物品協賛企業
    description: '物品協賛（ビッグエコー等）の企業を管理します。/sponsor の「物品協賛」に五十音順で表示されます。'
    folder: content/goods-sponsors
    create: true
    slug: '{{fields.name}}'
    identifier_field: name
    summary: '{{fields.nameKana}}｜{{fields.name}}'
    sortable_fields: [nameKana, name]
    fields:
      - { label: 企業名, name: name, widget: string }
      - label: 読み仮名
        name: nameKana
        widget: string
        hint: '五十音順の並び替えに使います。ひらがなで入力してください（例: びっぐえこー）。'
      - label: 画像
        name: image
        widget: image-r2
        required: false
        hint: 'ロゴや提供物の写真。未入力でも公開できます。画像は自動でリサイズ・WebP 変換して R2 に保存します。'
      - label: 企業サイト URL
        name: url
        widget: string
        required: false
        pattern: ['^https?://', 'http:// または https:// から始まる URL を入力してください']
        hint: '未入力でも公開できます。入力すると企業名と画像からリンクします。'
      - label: 説明文
        name: description
        widget: text
        required: false
        hint: '提供いただいた物品などを一言で。未入力でも公開できます。'
      - label: 下書き
        name: draft
        widget: boolean
        default: false

  - name: staff
    label: 実行委員の部署紹介
    label_singular: 部署
    description: 'スタッフページの部署紹介を管理します。表示順の小さい順に掲載します。'
    folder: content/staff
    create: true
    slug: '{{fields.sortOrder}}-{{slug}}'
    identifier_field: department
    summary: '{{fields.sortOrder}}｜{{fields.department}}'
    sortable_fields: [sortOrder, department]
    fields:
      - label: 表示順
        name: sortOrder
        widget: number
        value_type: int
        min: 0
        hint: '小さい番号の部署が先に表示されます。'
      - { label: 部署名, name: department, widget: string }
      - label: 部署の名簿
        name: members
        widget: list
        required: false
        label_singular: メンバー
        summary: '{{fields.role}}｜{{fields.name}}（{{fields.kana}}）'
        fields:
          - { label: 役職, name: role, widget: string }
          - { label: 氏名, name: name, widget: string }
          - { label: ふりがな, name: kana, widget: string }
      - { label: 部署の説明文, name: description, widget: text }
      - label: 部署の写真
        name: image
        widget: image-r2
        required: false
        hint: 'スマホの写真をそのままで大丈夫です。未設定の場合は写真なしで表示します。'

  - name: faq
    label: よくある質問
    label_singular: 質問
    description: '質問・カテゴリ・回答・参考リンクを管理します。公開後に /faq へ反映されます。'
    folder: content/faq
    create: true
    slug: '{{slug}}'
    identifier_field: question
    summary: '{{fields.category}}｜{{fields.question}}'
    sortable_fields: [category, question]
    fields:
      - { label: 質問, name: question, widget: string }
      - label: 質問カテゴリ
        name: category
        widget: string
        hint: '同じカテゴリ名の質問は、公開ページでひとまとまりに表示されます。'
      - label: 回答
        name: body
        widget: markdown
      - label: 参考リンク
        name: referenceLinks
        widget: list
        required: false
        label_singular: リンク
        summary: '{{fields.label}}'
        fields:
          - { label: リンク名, name: label, widget: string }
          - label: URL
            name: url
            widget: string
            pattern: ['^https?://', 'http:// または https:// で始まる URL を入力してください']
