    create: true
    slug: '{{fields.name}}'
    identifier_field: name
    summary: '{{fields.nameKana}}｜{{fields.name}}'
    sortable_fields: [nameKana, name]
    fields:
      - { label: 企業名, name: name, widget: string }
      - label: 読み仮名
        name: nameKana
        widget: string
        hint: '五十音順の並び替えに使います。ひらがなで入力してください（例: びっぐえこー）。'
      - label: 画像
        name: image
        widget: image-r2
        required: false
        hint: 'ロゴや提供物の写真。未入力でも公開できます。画像は自動でリサイズ・WebP 変換して R2 に保存します。'
      - label: 企業サイト URL
        name: url
        widget: string
        required: false
        pattern: ['^https?://', 'http:// または https:// から始まる URL を入力してください']
        hint: '未入力でも公開できます。入力すると企業名と画像からリンクします。'
      - label: 説明文
        name: description
        widget: text
        required: false
        hint: '提供いただいた物品などを一言で。未入力でも公開できます。'
      - label: 下書き
        name: draft
        widget: boolean
        default: false

  - name: staff
    label: 実行委員の部署紹介
    label_singular: 部署
    description: 'スタッフページの部署紹介を管理します。表示順の小さい順に掲載します。'
    folder: content/staff
    create: true
    slug: '{{fields.sortOrder}}-{{slug}}'
    identifier_field: department
    summary: '{{fields.sortOrder}}｜{{fields.department}}'
    sortable_fields: [sortOrder, department]
    fields:
      - label: 表示順
        name: sortOrder
        widget: number
        value_type: int
        min: 0
        hint: '小さい番号の部署が先に表示されます。'
      - { label: 部署名, name: department, widget: string }
      - label: 部署の名簿
        name: members
        widget: list
        required: false
        label_singular: メンバー
        summary: '{{fields.role}}｜{{fields.name}}（{{fields.kana}}）'
        fields:
          - { label: 役職, name: role, widget: string }
          - { label: 氏名, name: name, widget: string }
          - { label: ふりがな, name: kana, widget: string }
      - { label: 部署の説明文, name: description, widget: text }
      - label: 部署の写真
        name: image
        widget: image-r2
        required: false
        hint: 'スマホの写真をそのままで大丈夫です。未設定の場合は写真なしで表示します。'
      - label: 紹介動画（YouTube）
        name: video
        widget: string
        required: false
        hint: 'YouTube の動画 URL（例: https://www.youtube.com/watch?v=xxxxxxxxxxx、https://youtu.be/xxxxxxxxxxx）または 11 文字の動画 ID。未入力なら動画なしで表示します。'

  - name: settings
    label: サイト設定
    description: 'サイト全体の設定です。'
    files:
      - name: video
        label: 映像（YouTube）
        file: content/settings/video.json
        description: '再生リストまたはチャンネルの動画が、トップページの「実行委員紹介」に並びます（ビルド時に取得するため、変更はデプロイ後に反映されます）。'
        fields:
          - label: YouTube 再生リスト
            name: playlist
            widget: string
            required: false
            hint: '再生リストの URL（…list=PL… を含むもの）または ID（PL から始まる文字列）。入力すると、再生リストの並び順のまま表示します（見せたい順は YouTube 側で並べ替えてください）。「非公開」の再生リストは取得できないので、「公開」または「限定公開」にしてください。未入力ならチャンネルの最新動画を表示します。'
          - label: YouTube チャンネル
            name: channel
            widget: string
            hint: '再生リストが未入力のときに使います。チャンネル ID（UC から始まる 24 文字）、または @ハンドル（例: @example）。最新の動画から順に表示します。'
          - label: 表示する本数
            name: count
            widget: number
            value_type: int
            min: 1
            max: 15
            default: 6
            hint: '表示する本数（最大 15 本）。再生リストでは先頭から、チャンネルでは新しい順に数えます。'

  - name: faq
    label: よくある質問
    label_singular: 質問
    description: '質問・カテゴリ・回答・参考リンクを管理します。公開後に /faq へ反映されます。'
    folder: content/faq
    create: true
    slug: '{{slug}}'
    identifier_field: question
    summary: '{{fields.category}}｜{{fields.question}}'
    sortable_fields: [category, question]
    fields:
      - { label: 質問, name: question, widget: string }
      - label: 質問カテゴリ
        name: category
        widget: string
        hint: '同じカテゴリ名の質問は、公開ページでひとまとまりに表示されます。'
      - label: 回答
        name: body
        widget: markdown
      - label: 参考リンク
        name: referenceLinks
        widget: list
        required: false
        label_singular: リンク
        summary: '{{fields.label}}'
        fields:
          - { label: リンク名, name: label, widget: string }
          - label: URL
            name: url
            widget: string
            pattern: ['^https?://', 'http:// または https:// で始まる URL を入力してください']
