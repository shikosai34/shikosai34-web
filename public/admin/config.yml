# Decap CMS 設定 — お知らせ、サークル、体育館ステージ企画
#
# アクセス制御と GitHub 書き込み:
#   /admin/* と /cms/*（CMS Backend Worker）を Cloudflare Zero Trust Access で保護する。
#   編集者に GitHub ログインは求めない。base_url / api_root を workers/cms の Worker に
#   向け、Worker が installation token で GitHub REST API を代行する（Issue #17）。
#
# ローカルプレビュー:
#   `npx decap-server` を起動し、`bun dev` の http://localhost:4321/admin/ を開く。
#   （local_backend が有効な間は下の base_url / api_root は使われない）

backend:
  name: github
  repo: shikosai34/shikosai34-web
  branch: main # TODO(#17): Cloudflare のデプロイ対象ブランチに合わせて確認する
  # CMS Backend Worker（workers/cms）。34.shikosai.net/cms/* にマウント。
  base_url: https://34.shikosai.net
  api_root: https://34.shikosai.net/cms/github
  auth_endpoint: cms/auth
  commit_messages:
    create: 'cms: add {{collection}}/{{slug}}'
    update: 'cms: update {{collection}}/{{slug}}'
    delete: 'cms: delete {{collection}}/{{slug}}'
    openAuthoring: 'cms: {{message}}'

# `npx decap-server` を使ったローカル編集を許可する（本番には影響しない）
local_backend: true

locale: ja

# 見出し画像は image-r2 ウィジェット経由で R2 へアップロードする（下記フィールド定義）。
# ここの media_folder は本文（Markdown）中に挿入する画像用で、リポジトリへコミットされる。
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: news
    label: お知らせ
    label_singular: お知らせ
    description: 'ここで公開したお知らせは main へコミットされ、サイトのビルド後に /news へ反映されます。'
    folder: content/news
    create: true
    slug: '{{fields.slug}}'
    identifier_field: title
    sortable_fields: [publishedAt, title]
    fields:
      - { label: タイトル, name: title, widget: string }
      - label: URL 識別子
        name: slug
        widget: string
        hint: 'URL の末尾に使う半角英数字とハイフン（例: opening-hours）。公開後は変更しないでください。'
        pattern:
          ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '半角の英小文字・数字・ハイフンのみで入力してください']
      - label: 公開日時
        name: publishedAt
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
        format: 'YYYY-MM-DD[T]HH:mm:ss[+09:00]'
        picker_utc: false
      - label: 更新日時
        name: updatedAt
        widget: datetime
        required: false
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
        format: 'YYYY-MM-DD[T]HH:mm:ss[+09:00]'
        picker_utc: false
      - label: カテゴリ
        name: category
        widget: select
        default: news
        options:
          - { label: お知らせ, value: news }
          - { label: イベント, value: event }
          - { label: メディア掲載, value: press }
          - { label: 更新情報, value: update }
      - label: 見出し画像
        name: image
        widget: image-r2
        required: false
        hint: 'スマホの写真をそのままで大丈夫です。自動でリサイズ・WebP 変換して R2 に保存します。'
      - label: 要約
        name: description
        widget: text
        required: false
        hint: '一覧や SNS 共有時に表示される短い説明文。'
      - label: 下書き
        name: draft
        widget: boolean
        default: false
        hint: 'オンにしている間は本番サイトに表示されません。'
      - { label: 重要なお知らせ, name: important, widget: boolean, default: false }
      - { label: 本文, name: body, widget: markdown }

  - name: circles
    label: サークル
    label_singular: サークル
    description: 'ここで作成・編集したサークルは main へコミットされ、ビルド後に /circle へ反映されます。'
    folder: content/circles
    create: true
    slug: '{{fields.slug}}'
    identifier_field: name
    sortable_fields: [nameKana, name]
    fields:
      - { label: 団体名, name: name, widget: string }
      - label: 団体名（かな）
        name: nameKana
        widget: string
        hint: 'ひらがな。一覧の並び順に使います。'
      - label: URL 識別子
        name: slug
        widget: string
        hint: 'URL の末尾に使う半角英数字とハイフン（例: robotics）。公開後は変更しないでください。'
        pattern:
          ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '半角の英小文字・数字・ハイフンのみで入力してください']
      - label: カテゴリ
        name: category
        widget: select
        options:
          - { label: 1年生, value: grade1 }
          - { label: 2年生, value: grade2 }
          - { label: 3年生, value: grade3 }
          - { label: 4年生, value: grade4 }
          - { label: 5年生, value: grade5 }
          - { label: 専攻科, value: advanced }
          - { label: 運動部, value: sports }
          - { label: 文化部, value: culture }
          - { label: 有志サークル, value: other }
      - { label: 実施場所, name: location, widget: string, hint: '教室名など。' }
      - { label: 雨天時の場所・対応, name: rainLocation, widget: string, required: false, hint: '雨天時の場所、または中止などの対応。' }
      - label: サークルカテゴリ
        name: genre
        widget: select
        options:
          - { label: 文化, value: culture }
          - { label: 食品, value: food }
          - { label: 技術, value: tech }
      - label: 紹介文（短文）
        name: summary
        widget: text
        hint: '一覧のカードと詳細ページの冒頭に表示される、1〜2文の短い紹介です。'
      - label: 見所
        name: highlights
        widget: text
        required: false
        hint: '来場者に見てほしいポイント。'
      - label: 値段設定/企画詳細
        name: details
        widget: text
        required: false
        hint: '商品や体験の価格、企画の内容など。'
      - label: 実施時間（10月24日）
        name: scheduleDay1
        widget: string
        required: false
        hint: '開催時間（分かる場合）または「出店あり」。実施しない日は空欄にしてください。'
      - label: 実施時間（10月25日）
        name: scheduleDay2
        widget: string
        required: false
        hint: '開催時間（分かる場合）または「出店あり」。実施しない日は空欄にしてください。'
      - { label: FesFlow 導入予定, name: fesflowPlanned, widget: boolean, default: false }
      - label: サムネイル画像
        name: image
        widget: image-r2
        required: false
        hint: 'スマホの写真をそのままで大丈夫です。自動でリサイズ・WebP 変換して R2 に保存します。'
      - label: その他画像
        name: otherImages
        widget: list
        required: false
        label_singular: 画像
        field:
          label: 画像
          name: image
          widget: image-r2
        hint: '詳細ページに並べて表示する画像です。複数追加できます。'
      - label: SNS リンク
        name: snsLinks
        widget: list
        required: false
        label_singular: SNS リンク
        summary: '{{fields.label}}'
        fields:
          - { label: ラベル, name: label, widget: string, hint: '例: X / Instagram / 公式サイト' }
          - label: URL
            name: url
            widget: string
            pattern: ['^https?://', 'http:// または https:// で始まる URL を入力してください']
      - label: FesFlow ページ URL
        name: fesflowUrl
        widget: string
        required: false
        pattern: ['^https?://', 'http:// または https:// で始まる URL を入力してください']
        hint: '実行委員会が後から入力します。'
      - { label: 詳細, name: body, widget: markdown }

  - name: events
    label: ステージ企画
    label_singular: ステージ企画
    description: '体育館ステージの企画を管理します。開始日時順に /event と /timetable へ反映されます。'
    folder: content/events
    create: true
    slug: '{{fields.slug}}'
    identifier_field: title
    summary: '{{fields.startAt}}｜{{fields.title}}'
    sortable_fields: [startAt, endAt, title, performer]
    view_filters:
      - { label: 1日目（10月24日）, field: startAt, pattern: '^2026-10-24' }
      - { label: 2日目（10月25日）, field: startAt, pattern: '^2026-10-25' }
      - { label: 時間変更あり, field: status, pattern: 'changed' }
      - { label: 中止, field: status, pattern: 'cancelled' }
    fields:
      - { label: 企画名, name: title, widget: string }
      - label: URL 識別子
        name: slug
        widget: string
        hint: 'URL の末尾に使う半角英数字とハイフン（例: brass-band）。公開後は変更しないでください。'
        pattern:
          ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '半角の英小文字・数字・ハイフンのみで入力してください']
      - label: 出演団体
        name: performer
        widget: string
        hint: '公開する団体名を入力してください。個人名や連絡先は入力しないでください。'
      - label: 開始日時
        name: startAt
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
        format: 'YYYY-MM-DD[T]HH:mm:ss[+09:00]'
        picker_utc: false
        hint: '開催日の2026年10月24日または25日を選んでください。'
      - label: 終了日時
        name: endAt
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
        format: 'YYYY-MM-DD[T]HH:mm:ss[+09:00]'
        picker_utc: false
        hint: '開始日時と同じ日で、開始より後の時刻を選んでください。'
      - label: ジャンル
        name: genre
        widget: select
        default: other
        options:
          - { label: 音楽, value: music }
          - { label: ダンス, value: dance }
          - { label: パフォーマンス, value: performance }
          - { label: 大会・コンテスト, value: contest }
          - { label: 式典, value: ceremony }
          - { label: その他, value: other }
      - label: 当日の状態
        name: status
        widget: select
        default: scheduled
        options:
          - { label: 予定どおり, value: scheduled }
          - { label: 時間変更あり, value: changed }
          - { label: 中止, value: cancelled }
        hint: '直前の変更を来場者へ目立たせたい場合に切り替えます。'
      - label: 見出し画像
        name: image
        widget: image-r2
        required: false
        hint: '未入力でも公開できます。画像がある場合は自動でリサイズ・WebP 変換して R2 に保存します。'
      - label: 短い説明
        name: description
        widget: text
        required: false
        hint: '詳細ページの冒頭に表示する1〜2文の説明です。'
      - label: 下書き
        name: draft
        widget: boolean
        default: false
        hint: 'オンにしている間は本番サイトに表示されません。'
      - { label: 詳細, name: body, widget: markdown }

  - name: sponsors
    label: 協賛企業
    label_singular: 協賛企業
    description: '協賛企業を管理します。/sponsor に五十音順で表示され、協賛金額に応じて企業名の文字サイズが変わります。'
    folder: content/sponsors
    create: true
    slug: '{{fields.name}}'
    identifier_field: name
    summary: '{{fields.nameKana}}｜{{fields.name}}'
    sortable_fields: [nameKana, name, amount]
    fields:
      - { label: 企業名, name: name, widget: string }
      - label: 読み仮名
        name: nameKana
        widget: string
        hint: '五十音順の並び替えに使います。ひらがなで入力してください（例: みりおんすぽーつ）。'
      - label: 協賛金額（円）
        name: amount
        widget: number
        value_type: int
        min: 1
        hint: 'この値は画面には表示されません。文字サイズの算出にのみ使用します。'
      - label: 企業サイト URL
        name: url
        widget: string
        required: false
        pattern: ['^https?://', 'http:// または https:// から始まる URL を入力してください']
        hint: '未入力でも公開できます。入力すると企業名からリンクします。'
      - label: 下書き
        name: draft
        widget: boolean
        default: false
        hint: 'オンにしている間は本番サイトに表示されません。'
